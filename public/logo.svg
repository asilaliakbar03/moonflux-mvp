<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <radialGradient id="moonGrad" cx="0.4" cy="0.45" r="0.5">
      <stop offset="0%" stop-color="#E8E8E8"/>
      <stop offset="60%" stop-color="#B0B0B0"/>
      <stop offset="100%" stop-color="#707070"/>
    </radialGradient>
    <radialGradient id="starGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
  </defs>
  <!-- Moon sphere -->
  <circle cx="50" cy="60" r="36" fill="url(#moonGrad)"/>
  <!-- Eclipse shadow -->
  <circle cx="62" cy="60" r="36" fill="black" opacity="0.85"/>
  <!-- 4-pointed star -->
  <polygon points="70,60 60,52 70,20 80,52 120,60 80,68 70,100 60,68" fill="white" opacity="0.95"/>
  <!-- Star center glow -->
  <circle cx="70" cy="60" r="6" fill="url(#starGlow)"/>
</svg>
